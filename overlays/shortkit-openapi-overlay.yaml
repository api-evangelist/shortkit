- target: $.info
  description: Record the dual API-key authentication model as a machine-readable summary.
  update:
    x-authentication:
      style: api-key
      publishable:
        prefix: pk_{env}_
        header: X-API-Key
        access: read+ingest
      secret:
        prefix: sk_{env}_
        header: Authorization Bearer
        access: full-management
      environments: [live, test]
- target: $.components.schemas.Meta
  description: Note the standard response envelope and request-id tracing convention.
  update:
    x-envelope: '{ data, meta: { request_id, nextCursor? }, errors? }'
    x-request-id-field: meta.request_id
- target: $.paths['/content'].get
  description: Flag cursor-based pagination on list endpoints.
  update:
    x-pagination: {style: cursor, params: [limit, cursor], next: meta.nextCursor}
- target: $.paths['/content/upload'].post
  description: Cross-link the processing-pipeline webhook catalog.
  update:
    x-webhooks: asyncapi/shortkit-webhooks.yml
    x-rate-limit: 120/min (secret key, sliding window)
