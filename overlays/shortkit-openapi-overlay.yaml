overlay: 1.0.0
info:
  title: ShortKit API Evangelist Enrichment Overlay
  version: 1.0.0
extends: ../openapi/shortkit-openapi.yaml
actions:
- target: $.info
  description: Tag the specification with API Evangelist provenance.
  update:
    x-apievangelist:
      provider: shortkit
      category: [Video, Short-Form Video, Live Streaming, Advertising]
      backed-by: y-combinator
      docs: partner-gated (Mintlify) — source public at github.com/shortkit/docs
