openapi: 3.1.0
info:
  title: ShortKit API
  version: v1
  description: >-
    The ShortKit API lets you manage content, uploads, live streams, surveys, analytics, and ad
    configuration for your short-form vertical video feeds. It is organized around REST, uses
    standard HTTP methods, returns JSON wrapped in a standard envelope, and uses conventional HTTP
    status codes. All requests must be made over HTTPS.
  contact:
    name: ShortKit
    url: https://www.shortkit.dev
  x-logo:
    url: https://www.shortkit.dev/icon.svg
servers:
  - url: https://api.shortkit.dev/v1
    description: Production (base URL; environment is selected by the API key prefix — live vs test)
security:
  - SecretKey: []
tags:
  - name: Content
    description: Videos, image carousels, and video carousels in your feed.
  - name: Live Streams
    description: Real-time broadcasts that appear in the feed alongside on-demand content.
  - name: Surveys
    description: Short polls injected between content items in the feed.
  - name: Analytics
    description: Events and metrics for user interaction with your content.
  - name: Ad Configuration
    description: How ad slots are interleaved into the feed.
paths:
  /content:
    get:
      operationId: listContent
      summary: List Content
      tags: [Content]
      security:
        - SecretKey: []
        - PublishableKey: []
      parameters:
        - {name: limit, in: query, schema: {type: integer, default: 20}}
        - {name: cursor, in: query, schema: {type: string}, description: Opaque cursor from meta.nextCursor.}
        - {name: section, in: query, schema: {type: string}}
        - {name: contentType, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
        '401': {$ref: '#/components/responses/Error'}
  /content/upload:
    post:
      operationId: uploadContent
      summary: Upload Content
      description: Send metadata and receive signed upload URLs; the client uploads media directly to cloud storage.
      tags: [Content]
      security:
        - SecretKey: []
        - PublishableKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UploadRequest'}
      responses:
        '200': {$ref: '#/components/responses/ContentEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
  /content/import:
    post:
      operationId: importContent
      summary: Import Content
      description: Provide a source URL; ShortKit fetches and processes the media for you.
      tags: [Content]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, sourceUrl]
              properties:
                contentType: {type: string, enum: [video, carousel, video_carousel]}
                sourceUrl: {type: string, format: uri}
                title: {type: string, maxLength: 200}
                description: {type: string, maxLength: 2000}
                tags: {type: array, items: {type: string}}
                section: {type: string, maxLength: 200}
                author: {type: string, maxLength: 200}
                callbackUrl: {type: string, format: uri}
      responses:
        '200': {$ref: '#/components/responses/ContentEnvelope'}
        '400': {$ref: '#/components/responses/Error'}
  /content/count:
    get:
      operationId: getContentCount
      summary: Get Content Count
      tags: [Content]
      responses:
        '200':
          description: Count of content items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: object, properties: {count: {type: integer}}}
                  meta: {$ref: '#/components/schemas/Meta'}
  /content/search:
    get:
      operationId: searchContent
      summary: Search Content
      tags: [Content]
      parameters:
        - {name: q, in: query, required: true, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, default: 20}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ContentList'}
  /content/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
