        '200':
          description: List of events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Event'}}
                  meta: {$ref: '#/components/schemas/Meta'}
  /metrics/{metric}:
    get:
      operationId: getMetric
      summary: Get Metric
      tags: [Analytics]
      parameters:
        - {name: metric, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Metric value.}
  /metrics/{metric}/timeseries:
    get:
      operationId: getMetricTimeseries
      summary: Get Metric Timeseries
      tags: [Analytics]
      parameters:
        - {name: metric, in: path, required: true, schema: {type: string}}
        - {name: interval, in: query, schema: {type: string}}
      responses:
        '200': {description: Time series for the metric.}
  /live-streams:
    get:
      operationId: listLiveStreams
      summary: List Live Streams
      tags: [Live Streams]
      responses:
        '200':
          description: List of live streams.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/LiveStream'}}
                  meta: {$ref: '#/components/schemas/Meta'}
    post:
      operationId: createLiveStream
      summary: Create Live Stream
      description: Returns a ready-to-use RTMPS broadcast URL and stream key (shown once).
      tags: [Live Streams]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string, maxLength: 200}
                protocol: {type: string, enum: [hls, webrtc]}
                latencyMode: {type: string, enum: [low, reduced, standard]}
                reconnectWindow: {type: integer, minimum: 0, maximum: 1800, default: 60}
      responses:
        '200':
          description: Created live stream (includes rtmpUrl + streamKey).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/LiveStream'}
                  meta: {$ref: '#/components/schemas/Meta'}
  /live-streams/status:
    get:
      operationId: getLiveStreamStatus
      summary: Get Live Stream Status
      tags: [Live Streams]
      responses:
        '200': {description: Aggregate live stream status.}
  /live-streams/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getLiveStream
      summary: Get Live Stream
      tags: [Live Streams]
      responses:
        '200':
          description: The live stream.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {$ref: '#/components/schemas/LiveStream'}
                  meta: {$ref: '#/components/schemas/Meta'}
        '404': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteLiveStream
      summary: Delete Live Stream
      tags: [Live Streams]
      responses:
        '200': {description: Deleted.}
  /live-streams/{id}/end:
    post:
      operationId: endLiveStream
      summary: End Live Stream
      tags: [Live Streams]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Stream ended.}
  /live-streams/{id}/clips:
    post:
      operationId: createLiveStreamClips
      summary: Create Clips
      tags: [Live Streams]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                clips:
                  type: array
                  items:
                    type: object
                    properties:
                      startSeconds: {type: number}
                      endSeconds: {type: number}
      responses:
        '200': {description: Clips created.}
  /surveys:
    get:
      operationId: listSurveys
      summary: List Surveys
      tags: [Surveys]
      responses:
        '200':
          description: List of surveys.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: {type: array, items: {$ref: '#/components/schemas/Survey'}}
                  meta: {$ref: '#/components/schemas/Meta'}
    post:
      operationId: createSurvey
      summary: Create Survey
      tags: [Surveys]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, options]
              properties:
                title: {type: string}
                question: {type: string}
