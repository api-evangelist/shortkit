          application/json:
            schema: {$ref: '#/components/schemas/AdConfig'}
      responses:
        '200': {$ref: '#/components/responses/AdConfigEnvelope'}
components:
  securitySchemes:
    PublishableKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: >-
        Publishable key (prefix pk_{env}_). Read-only access to published content plus event
        ingestion and survey-response submission. Safe for client-side/mobile use.
    SecretKey:
      type: http
      scheme: bearer
      description: >-
        Secret key (prefix sk_{env}_) sent as a Bearer token. Full management access. Server-side
        only; bcrypt-hashed at rest and shown once at creation.
  responses:
    Error:
      description: Error response (standard envelope with errors[]).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ContentEnvelope:
      description: A single content item.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {$ref: '#/components/schemas/Content'}
              meta: {$ref: '#/components/schemas/Meta'}
    ContentList:
      description: A page of content items.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {type: array, items: {$ref: '#/components/schemas/Content'}}
              meta: {$ref: '#/components/schemas/Meta'}
    SurveyEnvelope:
      description: A single survey.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {$ref: '#/components/schemas/Survey'}
              meta: {$ref: '#/components/schemas/Meta'}
    AdConfigEnvelope:
      description: The ad configuration.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {$ref: '#/components/schemas/AdConfig'}
              meta: {$ref: '#/components/schemas/Meta'}
  schemas:
    Meta:
      type: object
      description: Envelope metadata. Always includes request_id; nextCursor present when more results exist.
      properties:
        request_id: {type: string, example: req_abc123def456}
        nextCursor: {type: string, nullable: true}
    ErrorEnvelope:
      type: object
      properties:
        data: {type: 'null'}
        meta: {$ref: '#/components/schemas/Meta'}
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum: [invalid_request, invalid_api_key, forbidden, not_found, conflict, rate_limited, internal_error]
              message: {type: string}
    UploadRequest:
      type: object
      required: [contentType, title]
      properties:
        contentType: {type: string, enum: [video, carousel, video_carousel]}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 2000}
        tags: {type: array, items: {type: string}}
        section: {type: string, maxLength: 200}
        author: {type: string, maxLength: 200}
        customMetadata: {type: object, additionalProperties: true}
        protected: {type: boolean}
        origin: {type: string, enum: [ios_upload, other], default: other}
        publishAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        autoScrollInterval: {type: number}
        callbackUrl: {type: string, format: uri, description: Webhook URL POSTed at each processing stage.}
        images:
          type: array
          items:
            type: object
            properties:
              position: {type: integer}
              altText: {type: string}
    Content:
      type: object
      properties:
        id: {type: string, format: uuid}
        contentType: {type: string, enum: [video, carousel, video_carousel, live_stream]}
        title: {type: string}
        description: {type: string}
        uploadStatus: {type: string, enum: [pending, processing, ready]}
        publishStatus: {type: string, enum: [draft, published]}
        duration: {type: number}
        streamingUrl: {type: string}
        thumbnailUrl: {type: string}
        protected: {type: boolean}
        section: {type: string}
        author: {type: string}
        tags: {type: array, items: {type: string}}
        customMetadata: {type: object, additionalProperties: true}
        captionTracks: {type: array, items: {type: object}}
        images: {type: array, items: {type: object}}
        liveStreamId: {type: string, nullable: true}
        publishAt: {type: string, nullable: true}
        expiresAt: {type: string, nullable: true}
        width: {type: integer}
        height: {type: integer}
        aspectRatio: {type: string, example: '9:16'}
        maxFrameRate: {type: integer}
        videoQuality: {type: string}
        resolutionTier: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    LiveStream:
      type: object
      properties:
        id: {type: string, format: uuid}
        playbackId: {type: string}
        status: {type: string, enum: [idle, active, ended]}
        protocol: {type: string, enum: [hls, webrtc]}
        title: {type: string, nullable: true}
        latencyMode: {type: string, enum: [low, reduced, standard], nullable: true}
        reconnectWindow: {type: integer, nullable: true}
        rtmpUrl: {type: string, nullable: true, description: Sensitive — broadcast URL with embedded credentials. Returned only on create.}
        streamKey: {type: string, nullable: true, description: Sensitive. Returned only on create.}
        startedAt: {type: string, nullable: true}
        endedAt: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
    Survey:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        question: {type: string}
        status: {type: string, enum: [draft, active, paused, archived]}
        priority: {type: integer}
        autoAdvanceDelay: {type: number}
        options:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              text: {type: string}
              position: {type: integer}
              responseCount: {type: integer}
              createdAt: {type: string, format: date-time}
        placementRules:
          type: array
          items:
            type: object
            properties:
              id: {type: string, format: uuid}
              ruleType: {type: string, example: min_videos_before}
              ruleValue: {type: object, additionalProperties: true}
              createdAt: {type: string, format: date-time}
        totalResponses: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    Event:
      type: object
      properties:
        id: {type: string, format: uuid}
        event_type: {type: string, example: playStart}
        content_id: {type: string, nullable: true}
        user_id: {type: string, example: user_abc123}
        session_id: {type: string, nullable: true}
        view_session_id: {type: string, nullable: true}
        timestamp: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        event_data: {type: object, additionalProperties: true}
    AdConfig:
      type: object
      properties:
        enabled: {type: boolean, default: false}
        frequency: {type: integer, default: 5}
        firstAdOffset: {type: integer, default: 3}
        maxPerPage: {type: integer, default: 3}
        adTagUrl: {type: string, nullable: true}
        adUnitId: {type: string, nullable: true}
        skipPolicy: {type: string, default: skippable_after}
        skipDelaySeconds: {type: integer, default: 5}
        defaultTargeting: {type: object, additionalProperties: true}
        nativeEnabled: {type: boolean, default: false}
        nativeFormatId: {type: string, nullable: true}
        nativeAdUnitId: {type: string, nullable: true}
        nativeVideoUrlKey: {type: string, default: video_url}
        nativeHeadlineKey: {type: string, default: headline}
        nativeCtaKey: {type: string, default: cta_text}
        nativeSponsorKey: {type: string, default: sponsor_name}
        nativeSponsorLogoKey: {type: string, default: sponsor_logo}
