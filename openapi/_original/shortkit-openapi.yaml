      responses:
        '200': {$ref: '#/components/responses/SurveyEnvelope'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: updateSurvey
      summary: Update Survey
      tags: [Surveys]
      requestBody:
        content:
