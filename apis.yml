aid: shortkit
name: ShortKit
description: >-
  ShortKit is a Y Combinator-backed short-form vertical video platform that gives product teams a
  drop-in, TikTok-quality video experience without the infrastructure complexity. It ships native
  SDKs for iOS, Android, Flutter, React Native, Expo and Web alongside a REST API for managing
  content, direct uploads, live streams, in-feed surveys, analytics events and ad configuration.
  The platform handles adaptive-bitrate HLS transcoding, global CDN delivery across 300+ points of
  presence, automatic caption generation with language detection, protected/signed playback, and
  native ad insertion (Google Ad Manager / VAST / IMA). Developer docs are partner-gated but the
  Mintlify API reference and the iOS SDK are published openly on GitHub.
