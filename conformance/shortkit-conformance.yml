standards:
- id: rest
  conforms: true
  evidence: Organized around REST — resource-oriented paths, standard HTTP methods, JSON bodies, conventional status codes.
- id: rfc9457
  conforms: false
  evidence: Errors use a custom envelope (data/meta/errors[]) with code+message, not application/problem+json.
- id: pagination
  conforms: true
  evidence: Cursor-based pagination on list endpoints via limit + cursor params and meta.nextCursor.
- id: idempotency
