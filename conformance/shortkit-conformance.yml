  evidence: No Idempotency-Key header documented; only a 409 conflict for duplicate state.
- id: oauth2
  conforms: false
  evidence: Authentication is API-key based (publishable X-API-Key, secret Bearer). No OAuth 2.0 flows.
- id: oidc
  conforms: false
  evidence: No OpenID Connect discovery or ID tokens.
- id: 'json:api'
  conforms: false
  evidence: Custom envelope, not the JSON:API media type or document structure.
- id: hls
  conforms: true
  evidence: Adaptive-bitrate HLS transcoding ladder; live streams support HLS (and WebRTC) ingest/delivery protocols.
- id: rtmp
  conforms: true
  evidence: Live stream ingest via ready-to-use RTMPS broadcast URLs.
- id: vast_vmap
  conforms: true
  evidence: Ad configuration passes VAST/VMAP ad tag URLs to the client ad player; native ad format mapping (Google Ad Manager / IMA).
- id: bcp47
  conforms: true
  evidence: Auto-detected content language stored as customMetadata.language using BCP 47 codes.
